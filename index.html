<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | VI PRINTING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6;
            border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800">

    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 p-2 rounded-lg">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight">Admin Dashboard</h1>
                        <p class="text-[10px] text-slate-400 uppercase tracking-widest">VI PRINTING</p>
                    </div>
                </div>
                <button onclick="loadOrders()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors border border-slate-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Segarkan Data
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Statistik Cepat -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-bold uppercase tracking-wider">Total Pesanan</p>
                <p id="stat-total" class="text-2xl font-black text-slate-900 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-b-4 border-b-yellow-400">
                <p class="text-xs text-slate-500 font-bold uppercase tracking-wider">Menunggu</p>
                <p id="stat-pending" class="text-2xl font-black text-slate-900 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-b-4 border-b-blue-500">
                <p class="text-xs text-slate-500 font-bold uppercase tracking-wider">Diproses</p>
                <p id="stat-proses" class="text-2xl font-black text-slate-900 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-b-4 border-b-green-500">
                <p class="text-xs text-slate-500 font-bold uppercase tracking-wider">Selesai</p>
                <p id="stat-selesai" class="text-2xl font-black text-slate-900 mt-1">0</p>
            </div>
        </div>

        <!-- Area Filter & List -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-200 bg-slate-50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <h2 class="font-bold text-slate-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    Manajemen Pesanan
                </h2>
                
                <div class="flex bg-slate-200/50 p-1 rounded-lg w-full sm:w-auto overflow-x-auto text-[11px] font-bold">
                    <button onclick="filterOrders('Semua')" id="btn-filter-Semua" class="filter-tab flex-1 sm:flex-none px-4 py-2 rounded-md bg-white shadow text-blue-600 transition-all whitespace-nowrap">Semua</button>
                    <button onclick="filterOrders('Menunggu')" id="btn-filter-Menunggu" class="filter-tab flex-1 sm:flex-none px-4 py-2 rounded-md text-slate-500 hover:text-slate-700 transition-all whitespace-nowrap">Menunggu</button>
                    <button onclick="filterOrders('Diproses')" id="btn-filter-Diproses" class="filter-tab flex-1 sm:flex-none px-4 py-2 rounded-md text-slate-500 hover:text-slate-700 transition-all whitespace-nowrap">Diproses</button>
                </div>
            </div>

            <!-- Loader -->
            <div id="loading-state" class="py-20 flex flex-col items-center justify-center">
                <div class="loader mb-4"></div>
                <p class="text-sm font-medium text-slate-500 uppercase tracking-widest">Mengambil Data Pesanan...</p>
            </div>

            <!-- Tempat Render Daftar Pesanan -->
            <div id="orders-container" class="divide-y divide-slate-100 hidden">
                <!-- Data akan disuntikkan lewat JS -->
            </div>
            
            <!-- Jika Kosong -->
            <div id="empty-state" class="py-20 flex flex-col items-center justify-center hidden">
                <svg class="w-16 h-16 text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                <p class="text-sm font-medium text-slate-500">Tidak ada data pesanan.</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://zqxeoveanevsvynptckm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxeGVvdmVhbmV2c3Z5bnB0Y2ttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNzUzODEsImV4cCI6MjA4OTg1MTM4MX0.eeIaytpW1wtWPJc2FbhufkDkhONUt9yypTZU4dTVmsM";

// Inisialisasi Supabase Client
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allOrders = [];
let currentFilter = 'Semua';

        // Pilihan Status yang diperbolehkan
        const STATUS_OPTIONS = [
            "Menunggu Konfirmasi (COD)",
            "Pesanan Diproses",
            "Pesanan Dikirim",
            "Selesai",
            "Dibatalkan"
        ];

        // Format Uang Rupiah
        function formatIDR(val) {
            return "Rp " + parseInt(val).toLocaleString('id-ID');
        }

        // Format Tanggal (Dari ISO ke format mudah dibaca)
        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleDateString('id-ID', {
                day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        // Fungsi Toast Notification (Pengganti alert)
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-green-600' : (type === 'error' ? 'bg-red-600' : 'bg-blue-600');
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2 transform transition-all duration-300 translate-y-[-20px] opacity-0 pointer-events-auto`;
            
            let icon = '';
            if (type === 'success') icon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            else if (type === 'error') icon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);

            // Animasi masuk
            setTimeout(() => {
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
            }, 10);

            // Hilang otomatis setelah 3 detik
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-10');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3000);
        }

        // Warna badge berdasarkan status
        function getStatusColor(status) {
            if (status.includes("Menunggu")) return "bg-yellow-100 text-yellow-800 border-yellow-200";
            if (status.includes("Diproses")) return "bg-blue-100 text-blue-800 border-blue-200";
            if (status.includes("Dikirim")) return "bg-purple-100 text-purple-800 border-purple-200";
            if (status.includes("Selesai")) return "bg-green-100 text-green-800 border-green-200";
            if (status.includes("Batal")) return "bg-red-100 text-red-800 border-red-200";
            return "bg-slate-100 text-slate-800 border-slate-200";
        }

        async function loadOrders(isSilentUpdate = false) {
    if (!isSilentUpdate) {
        document.getElementById('loading-state').classList.remove('hidden');
        document.getElementById('orders-container').classList.add('hidden');
        document.getElementById('empty-state').classList.add('hidden');
    }
    
    try {
        // Tetap menggunakan fetch REST API Anda yang sudah ada untuk memuat data awal
        const response = await fetch(`${SUPABASE_URL}/rest/v1/pesanan?select=*&order=tanggal.desc`, {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
            }
        });

        if (!response.ok) throw new Error("Gagal terhubung ke database.");
        allOrders = await response.json();
        updateStatistics();
        applyFilter();
        
    } catch (error) {
        console.error(error);
        if (!isSilentUpdate) showToast('Gagal memuat data pesanan.', 'error');
        document.getElementById('loading-state').classList.add('hidden');
    }
}

// FUNGSI BARU: Mendengarkan perubahan Realtime
function initializeRealtime() {
    supabaseClient
        .channel('pembaruan-pesanan')
        .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'pesanan' },
            (payload) => {
                console.log('Perubahan terdeteksi:', payload);
                // Tarik ulang data secara diam-diam agar tabel langsung ter-update
                loadOrders(true); 
                
                // Opsional: Tampilkan notifikasi jika ada pesanan baru
                if (payload.eventType === 'INSERT') {
                    showToast('Pesanan baru saja masuk!', 'success');
                }
            }
        )
        .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                console.log('Terhubung ke Supabase Realtime');
            }
        });
}

        function updateStatistics() {
            document.getElementById('stat-total').innerText = allOrders.length;
            document.getElementById('stat-pending').innerText = allOrders.filter(o => o.status.includes('Menunggu')).length;
            document.getElementById('stat-proses').innerText = allOrders.filter(o => o.status.includes('Diproses') || o.status.includes('Dikirim')).length;
            document.getElementById('stat-selesai').innerText = allOrders.filter(o => o.status.includes('Selesai')).length;
        }

        function filterOrders(filterName) {
            currentFilter = filterName;
            
            // Ubah gaya tab
            document.querySelectorAll('.filter-tab').forEach(el => {
                el.classList.remove('bg-white', 'shadow', 'text-blue-600');
                el.classList.add('text-slate-500');
            });
            const activeBtn = document.getElementById(`btn-filter-${filterName}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-500');
                activeBtn.classList.add('bg-white', 'shadow', 'text-blue-600');
            }

            applyFilter();
        }

        function applyFilter() {
            let filtered = allOrders;
            if (currentFilter === 'Menunggu') filtered = allOrders.filter(o => o.status.includes('Menunggu'));
            if (currentFilter === 'Diproses') filtered = allOrders.filter(o => o.status.includes('Diproses') || o.status.includes('Dikirim'));
            
            renderOrders(filtered);
        }

        function renderOrders(ordersData) {
            const container = document.getElementById('orders-container');
            document.getElementById('loading-state').classList.add('hidden');
            
            if (ordersData.length === 0) {
                container.classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('empty-state').classList.add('hidden');
            container.classList.remove('hidden');

            container.innerHTML = ordersData.map(order => {
                // Parsing detail items (biasanya berupa array JSON di kolom data_items)
                let itemsList = [];
                let detailItemsHTML = '';
                
                try {
                    let items = order.data_items;
                    if (typeof items === 'string') items = JSON.parse(items);
                    
                    if (Array.isArray(items)) {
                        itemsList = items.map(i => `<span class="font-semibold">${i.qty}x</span> ${i.nama}`);
                        detailItemsHTML = items.map(i => `
                            <div class="flex justify-between text-[11px] text-slate-600 mb-1">
                                <span>- ${i.nama} (${i.qty} pcs)</span>
                                <span>${formatIDR(i.subtotal_item || (i.qty * i.harga))}</span>
                            </div>
                        `).join('');
                    }
                } catch(e) { console.error("Error parsing items", e); }

                const itemsSummary = itemsList.length > 0 ? itemsList.join(' • ') : 'Detail item tidak terbaca';
                
                // Pembuatan Opsi Status Dropdown
                const statusOptionsHTML = STATUS_OPTIONS.map(opt => {
                    const isSelected = order.status === opt ? 'selected' : '';
                    return `<option value="${opt}" ${isSelected}>${opt}</option>`;
                }).join('');

                return `
                <div class="p-4 sm:p-5 hover:bg-slate-50/50 transition-colors">
                    <div class="flex flex-col lg:flex-row justify-between gap-4">
                        
                        <!-- Info Pesanan Kiri -->
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="font-bold text-slate-800 text-sm">${order.id}</span>
                                <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded uppercase tracking-wider">${formatDate(order.tanggal)}</span>
                            </div>
                            
                            <div class="mb-3">
                                <p class="text-xs text-slate-500 flex items-center gap-1.5 mb-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    ${order.email_member}
                                </p>
                                <p class="text-xs text-slate-800 line-clamp-2">${itemsSummary}</p>
                            </div>
                            
                            <!-- Toggle Detail (Tersembunyi) -->
                            <details class="group bg-slate-50 border border-slate-200 rounded-lg">
                                <summary class="cursor-pointer text-[10px] font-bold text-slate-500 uppercase tracking-widest p-2 list-none flex items-center justify-between hover:bg-slate-100 transition-colors">
                                    Lihat Rincian Harga
                                    <svg class="w-4 h-4 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </summary>
                                <div class="p-3 border-t border-slate-200 bg-white">
                                    ${detailItemsHTML}
                                    <div class="flex justify-between font-bold text-sm text-slate-900 mt-2 pt-2 border-t border-slate-100 border-dashed">
                                        <span>TOTAL</span>
                                        <span>${formatIDR(order.total)}</span>
                                    </div>
                                </div>
                            </details>
                        </div>
                        
                        <!-- Aksi Kanan (Status & Harga Total) -->
                        <div class="lg:w-64 flex flex-col justify-between items-start lg:items-end gap-3 border-t lg:border-t-0 pt-4 lg:pt-0 border-slate-100">
                            <div class="text-left lg:text-right w-full">
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">Total Bayar</p>
                                <p class="font-black text-lg text-blue-600">${formatIDR(order.total)}</p>
                            </div>
                            
                            <div class="w-full">
                                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Ubah Status</label>
                                <div class="relative w-full">
                                    <select id="status-select-${order.id}" 
                                            onchange="updateStatus('${order.id}', this.value, this)" 
                                            class="w-full appearance-none bg-white border border-slate-300 text-slate-700 py-2 pl-3 pr-8 rounded-lg text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm cursor-pointer transition-all">
                                        ${statusOptionsHTML}
                                    </select>
                                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </div>
                                </div>
                                <div id="status-badge-${order.id}" class="mt-2 inline-block text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider border ${getStatusColor(order.status)}">
                                    Saat ini: ${order.status}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function updateStatus(orderId, newStatus, selectElement) {
            // Nonaktifkan sementara select box agar tidak di klik berulang kali
            selectElement.disabled = true;
            const originalColor = selectElement.style.backgroundColor;
            selectElement.style.backgroundColor = '#f1f5f9';
            
            showToast('Menyimpan perubahan...', 'info');

            try {
                // Lakukan Update (PATCH) ke Supabase
                const response = await fetch(`${SUPABASE_URL}/rest/v1/pesanan?id=eq.${orderId}`, {
                    method: 'PATCH',
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!response.ok) throw new Error("Gagal update data di server");

                // Update data lokal agar UI sinkron tanpa harus ambil ulang semuanya dari server
                const orderIndex = allOrders.findIndex(o => o.id === orderId);
                if (orderIndex !== -1) {
                    allOrders[orderIndex].status = newStatus;
                }

                // Update badge warna di bawah select box
                const badge = document.getElementById(`status-badge-${orderId}`);
                if (badge) {
                    badge.className = `mt-2 inline-block text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider border ${getStatusColor(newStatus)}`;
                    badge.innerText = `Saat ini: ${newStatus}`;
                }

                updateStatistics();
                showToast(`Status berhasil diubah menjadi: ${newStatus}`, 'success');

            } catch (error) {
                console.error(error);
                showToast('Gagal merubah status pesanan!', 'error');
                
                // Kembalikan pilihan ke sebelumnya jika error
                const oldOrder = allOrders.find(o => o.id === orderId);
                if(oldOrder) selectElement.value = oldOrder.status;
                
            } finally {
                // Aktifkan kembali elemen select
                selectElement.disabled = false;
                selectElement.style.backgroundColor = originalColor;
            }
        }

        // Jalankan saat halaman dibuka
        window.onload = () => {
    loadOrders();
    initializeRealtime();
};

    </script>
</body>
</html>
